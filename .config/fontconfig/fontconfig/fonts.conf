<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- Set default monospace to JetBrains Mono -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrains Mono</family>
        </prefer>
    </alias>

    <!-- Global fallback for missing symbols/glyphs -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>JetBrains Mono</family>
            <family>DejaVu Sans</family>
        </prefer>
    </alias>

</fontconfig>

